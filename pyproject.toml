[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", ".venv", "datasets", "runs", "weights"]

[tool.ruff.lint]
# Conservative correctness rules; preserve upstream YOLOv9 public APIs.
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
