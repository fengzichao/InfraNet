name: InfraNet-IR C-only checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: C-only topology and declared image order
        run: |
          python tools/check_release.py
          python tests/test_modality_contract.py

  cpu-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - name: C-only conversion, gradient, paired training-validation and IR evaluation
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python tests/smoke_qualgate.py
          python tests/test_actual_gate_routing.py
          python tests/test_conversion_scaled.py
          python tests/test_convert_cli_scaled.py
          python tests/test_training_loss.py
          python tests/test_dataset_pairing.py
          python tests/test_paired_augmentation.py
          python tests/test_c_paired_validation.py
          python tests/test_ir_eval_scaled.py
          python tests/test_training_smoke.py
